<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gondopar - Visualização 360°</title>

  <script
    type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #e5e5e5;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      background: linear-gradient(
        180deg,
        #f5f5f5 0%,
        #e5e5e5 65%,
        #cccccc 100%
      );
    }
  </style>
</head>

<body>

  <model-viewer
    src="TESTE DERMO.glb"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    shadow-softness="0.8"
    exposure="1.1">
  </model-viewer>

</body>

</html>
