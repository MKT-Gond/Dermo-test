<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gondopar - Visualização 360°</title>

  <script
    type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #ececec;
      overflow: hidden;
    }

    .page {
      width: 100%;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    model-viewer {
      width: 100%;
      height: 100vh;

      background: linear-gradient(
        180deg,
        #f8f8f8 0%,
        #eeeeee 55%,
        #d7d7d7 100%
      );
    }

    .brand {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;

      background: rgba(255,255,255,0.92);
      padding: 12px 28px;
      border-radius: 30px;

      font-size: 22px;
      font-weight: 700;
      letter-spacing: 5px;
      color: #2b2b2b;

      box-shadow:
        0 8px 25px rgba(0,0,0,0.08);

      pointer-events: none;
    }

    .subtitle {
      position: absolute;
      top: 82px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;

      font-size: 12px;
      letter-spacing: 2px;
      color: #777;
      text-transform: uppercase;

      pointer-events: none;
    }

    .hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;

      background: rgba(255,255,255,0.92);
      padding: 10px 18px;
      border-radius: 22px;

      font-size: 13px;
      color: #555;

      box-shadow:
        0 6px 20px rgba(0,0,0,0.08);

      pointer-events: none;
    }

    @media (max-width: 600px) {

      .brand {
        top: 16px;
        font-size: 18px;
        letter-spacing: 4px;
        padding: 10px 20px;
      }

      .subtitle {
        top: 67px;
        font-size: 10px;
      }

      .hint {
        bottom: 16px;
        font-size: 12px;
        padding: 9px 14px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="brand">
      GONDOPAR
    </div>

    <div class="subtitle">
      Visualização 360°
    </div>

    <model-viewer
      src="TESTE DERMO.glb"

      camera-controls

      auto-rotate
      auto-rotate-delay="1800"
      rotation-per-second="12deg"

      shadow-intensity="0.8"
      shadow-softness="0.95"

      exposure="1.0"

      environment-image="neutral"

      tone-mapping="neutral"

      interaction-prompt="auto">

    </model-viewer>

    <div class="hint">
      ↻ Arraste para girar • Role para aproximar
    </div>

  </div>

</body>

</html>
