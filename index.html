<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gondopar | Visualização 360°</title>

  <!-- MODEL VIEWER -->
  <script
    type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>

    /* =========================
       CONFIGURAÇÕES GERAIS
    ========================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #fafafa;
      color: #333;
    }

    :root {
      --gondopar: #d80019;
      --cinza: #777;
      --borda: #eeeeee;
    }


    /* =========================
       PÁGINA
    ========================== */

    .pagina {
      position: relative;
      width: 100%;
      height: 100vh;

      background:
        radial-gradient(
          circle at 50% 40%,
          #ffffff 0%,
          #fafafa 50%,
          #f1f1f1 100%
        );
    }


    /* =========================
       CABEÇALHO
    ========================== */

    .cabecalho {
      position: absolute;

      top: 25px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 20;

      text-align: center;

      pointer-events: none;
    }

    .logo {
      font-size: 34px;
      font-weight: 800;

      letter-spacing: 6px;

      color: var(--gondopar);
    }

    .slogan {
      margin-top: 5px;

      font-size: 12px;

      letter-spacing: 2px;

      color: #8a8a8a;

      text-transform: uppercase;
    }

    .linha-logo {
      width: 80px;
      height: 2px;

      margin: 13px auto 0;

      background: var(--gondopar);
    }


    /* =========================
       MODEL VIEWER
    ========================== */

    model-viewer {
      position: absolute;

      width: 100%;
      height: 100%;

      top: 0;
      left: 0;

      background: transparent;

      --poster-color: transparent;
    }


    /* =========================
       BARRA ESQUERDA
    ========================== */

    .instrucoes {
      position: absolute;

      top: 50%;
      left: 28px;

      transform: translateY(-50%);

      width: 105px;

      padding: 22px 12px;

      z-index: 30;

      background: rgba(255,255,255,0.94);

      border: 1px solid rgba(0,0,0,0.04);

      border-radius: 22px;

      box-shadow:
        0 15px 40px rgba(0,0,0,0.08);

      backdrop-filter: blur(8px);

      text-align: center;
    }

    .instrucao {
      padding: 14px 3px;

      font-size: 9px;

      letter-spacing: .6px;

      color: #777;

      text-transform: uppercase;
    }

    .icone {
      font-size: 24px;

      margin-bottom: 7px;

      color: #555;
    }

    .divisor {
      width: 40px;
      height: 1px;

      margin: 3px auto;

      background: #ddd;
    }


    /* =========================
       BOTÃO TELA CHEIA
    ========================== */

    .fullscreen {
      position: absolute;

      top: 27px;
      right: 30px;

      z-index: 40;

      width: 52px;
      height: 52px;

      display: flex;

      justify-content: center;
      align-items: center;

      border: none;

      border-radius: 50%;

      background: rgba(255,255,255,0.95);

      box-shadow:
        0 10px 30px rgba(0,0,0,0.08);

      cursor: pointer;

      font-size: 20px;

      color: #444;

      transition: .2s;
    }

    .fullscreen:hover {
      transform: scale(1.06);
    }


    /* =========================
       INDICADOR GONDOPAR
    ========================== */

    .barra-vermelha {
      position: absolute;

      top: 40px;
      left: 20px;

      z-index: 20;

      width: 4px;
      height: 45px;

      border-radius: 3px;

      background: var(--gondopar);
    }


    /* =========================
       CONTROLES DE VISTA
    ========================== */

    .vistas {
      position: absolute;

      bottom: 60px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 40;

      display: flex;

      gap: 8px;

      padding: 10px;

      border-radius: 20px;

      background: rgba(255,255,255,0.94);

      box-shadow:
        0 12px 35px rgba(0,0,0,0.10);

      backdrop-filter: blur(8px);
    }

    .vista-btn {
      width: 58px;
      height: 58px;

      border: 1px solid transparent;

      border-radius: 12px;

      background: #fafafa;

      cursor: pointer;

      color: #777;

      font-size: 10px;

      transition: .2s;
    }

    .vista-btn:hover {
      border-color: #ddd;
      background: white;
    }

    .vista-btn.ativo {
      border-color: var(--gondopar);
      color: var(--gondopar);
      background: white;
    }

    .vista-icon {
      display: block;

      font-size: 19px;

      margin-bottom: 4px;
    }


    /* =========================
       RODAPÉ
    ========================== */

    .rodape {
      position: absolute;

      bottom: 16px;
      left: 25px;
      right: 25px;

      z-index: 20;

      display: flex;

      justify-content: space-between;

      font-size: 11px;

      color: #999;

      pointer-events: none;
    }

    .rodape strong {
      color: var(--gondopar);
      font-weight: 600;
    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 700px) {

      .cabecalho {
        top: 17px;
      }

      .logo {
        font-size: 24px;
        letter-spacing: 4px;
      }

      .slogan {
        font-size: 8px;
        letter-spacing: 1.3px;
      }

      .linha-logo {
        margin-top: 8px;
        width: 55px;
      }

      .instrucoes {
        display: none;
      }

      .barra-vermelha {
        display: none;
      }

      .fullscreen {
        width: 43px;
        height: 43px;

        top: 17px;
        right: 15px;
      }

      .vistas {
        bottom: 46px;

        padding: 7px;

        border-radius: 16px;
      }

      .vista-btn {
        width: 50px;
        height: 50px;

        font-size: 8px;
      }

      .rodape {
        bottom: 10px;

        left: 14px;
        right: 14px;

        font-size: 8px;
      }

      .rodape .site {
        display: none;
      }
    }

  </style>
</head>


<body>

<div class="pagina">

  <!-- IDENTIDADE VISUAL -->

  <div class="barra-vermelha"></div>

  <header class="cabecalho">

    <div class="logo">
      GONDOPAR
    </div>

    <div class="slogan">
      Soluções em mobiliário para farmácias
    </div>

    <div class="linha-logo"></div>

  </header>


  <!-- VISUALIZADOR 3D -->

  <model-viewer

    id="produto3d"

    src="TESTE DERMO.glb"

    camera-controls

    auto-rotate
    auto-rotate-delay="2500"
    rotation-per-second="8deg"

    shadow-intensity="0.55"
    shadow-softness="0.95"

    exposure="1"

    environment-image="neutral"

    tone-mapping="neutral"

    interaction-prompt="none"

    camera-orbit="30deg 75deg auto"

    min-camera-orbit="auto auto 65%"
    max-camera-orbit="auto auto 280%"

    ar

    ar-modes="webxr scene-viewer quick-look">

  </model-viewer>


  <!-- INSTRUÇÕES -->

  <div class="instrucoes">

    <div class="instrucao">

      <div class="icone">
        ☝
      </div>

      Arraste<br>
      para girar

    </div>

    <div class="divisor"></div>

    <div class="instrucao">

      <div class="icone">
        ⌕
      </div>

      Role para<br>
      aproximar

    </div>

    <div class="divisor"></div>

    <div class="instrucao">

      <div class="icone">
        ◇
      </div>

      Visualização<br>
      360°

    </div>

  </div>


  <!-- TELA CHEIA -->

  <button
    class="fullscreen"
    onclick="telaCheia()"
    title="Tela cheia">

    ⛶

  </button>


  <!-- VISTAS RÁPIDAS -->

  <div class="vistas">

    <button
      class="vista-btn ativo"
      onclick="mudarVista(this, '30deg 75deg auto')">

      <span class="vista-icon">◩</span>
      3D

    </button>


    <button
      class="vista-btn"
      onclick="mudarVista(this, '0deg 90deg auto')">

      <span class="vista-icon">▣</span>
      Frente

    </button>


    <button
      class="vista-btn"
      onclick="mudarVista(this, '90deg 90deg auto')">

      <span class="vista-icon">▯</span>
      Lateral

    </button>


    <button
      class="vista-btn"
      onclick="mudarVista(this, '180deg 90deg auto')">

      <span class="vista-icon">▣</span>
      Traseira

    </button>

  </div>


  <!-- RODAPÉ -->

  <footer class="rodape">

    <div>
      © 2026 <strong>GONDOPAR</strong>
      · Todos os direitos reservados.
    </div>

    <div class="site">
      <strong>www.gondopar.com.br</strong>
    </div>

  </footer>

</div>


<script>

  const viewer = document.getElementById("produto3d");


  /* TROCAR VISTA */

  function mudarVista(botao, camera) {

    viewer.autoRotate = false;

    viewer.cameraOrbit = camera;

    document
      .querySelectorAll(".vista-btn")
      .forEach(btn => btn.classList.remove("ativo"));

    botao.classList.add("ativo");

  }


  /* TELA CHEIA */

  function telaCheia() {

    const pagina = document.querySelector(".pagina");

    if (!document.fullscreenElement) {

      pagina.requestFullscreen();

    } else {

      document.exitFullscreen();

    }

  }

</script>

</body>

</html>
