<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gondopar | Visualização 360°</title>

  <script
    type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    :root {
      --vermelho: #d80019;
    }


    /* FUNDO */

    .pagina {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;

      background:
        radial-gradient(
          ellipse at 50% 42%,
          #f7f7f7 0%,
          #eeeeee 35%,
          #dddddd 70%,
          #cccccc 100%
        );
    }


    /* CABEÇALHO */

    .cabecalho {
      position: absolute;
      z-index: 20;

      top: 22px;
      left: 50%;

      transform: translateX(-50%);

      text-align: center;
      white-space: nowrap;

      pointer-events: none;
    }

    .logo {
      color: var(--vermelho);

      font-size: 34px;
      font-weight: 900;
      letter-spacing: 6px;
    }

    .slogan {
      margin-top: 5px;

      color: #777;

      font-size: 11px;
      letter-spacing: 2.2px;

      text-transform: uppercase;
    }

    .linha {
      width: 80px;
      height: 2px;

      margin: 12px auto 0;

      background: var(--vermelho);
    }


    /* DETALHE VERMELHO */

    .detalhe {
      position: absolute;

      top: 34px;
      left: 20px;

      width: 4px;
      height: 48px;

      background: var(--vermelho);
      border-radius: 5px;

      z-index: 30;
    }


    /* MODELO */

    model-viewer {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background: transparent;

      --poster-color: transparent;
    }


    /* PAINEL DE INSTRUÇÕES */

    .instrucoes {
      position: absolute;

      left: 25px;
      top: 50%;

      transform: translateY(-50%);

      z-index: 30;

      width: 105px;

      padding: 14px 10px;

      border-radius: 22px;

      background: rgba(255,255,255,0.88);

      border: 1px solid rgba(255,255,255,0.7);

      box-shadow:
        0 15px 40px rgba(0,0,0,0.10);

      backdrop-filter: blur(12px);

      text-align: center;
    }

    .item {
      padding: 16px 3px;

      font-size: 9px;
      line-height: 1.4;

      color: #666;

      text-transform: uppercase;
    }

    .icone {
      margin-bottom: 7px;

      font-size: 23px;

      color: var(--vermelho);
    }

    .item strong {
      color: #444;
      font-size: 10px;
    }

    .separador {
      width: 42px;
      height: 1px;

      margin: 0 auto;

      background: #d2d2d2;
    }


    /* TELA CHEIA */

    .fullscreen {
      position: absolute;

      top: 25px;
      right: 28px;

      z-index: 40;

      width: 52px;
      height: 52px;

      border: none;
      border-radius: 50%;

      background: rgba(255,255,255,0.92);

      box-shadow:
        0 10px 30px rgba(0,0,0,0.10);

      color: #444;

      font-size: 21px;

      cursor: pointer;
    }

    .fullscreen:hover {
      color: var(--vermelho);
      transform: scale(1.06);
    }


    /* VISTAS */

    .vistas {
      position: absolute;

      left: 50%;
      bottom: 54px;

      transform: translateX(-50%);

      z-index: 40;

      display: flex;
      gap: 7px;

      padding: 9px;

      border-radius: 20px;

      background: rgba(255,255,255,0.90);

      box-shadow:
        0 12px 35px rgba(0,0,0,0.12);

      backdrop-filter: blur(12px);
    }

    .vista {
      width: 58px;
      height: 54px;

      border: 1px solid transparent;
      border-radius: 12px;

      background: transparent;

      color: #777;

      font-size: 9px;

      cursor: pointer;
    }

    .vista span {
      display: block;

      margin-bottom: 3px;

      font-size: 18px;
    }

    .vista:hover {
      background: #f4f4f4;
    }

    .vista.ativa {
      background: #fff;

      color: var(--vermelho);

      border-color: var(--vermelho);
    }


    /* RODAPÉ */

    .rodape {
      position: absolute;

      left: 25px;
      right: 25px;
      bottom: 14px;

      z-index: 30;

      display: flex;
      justify-content: space-between;

      color: #777;

      font-size: 10px;

      pointer-events: none;
    }

    .rodape strong {
      color: var(--vermelho);
    }


    /* =========================================
       CELULAR - MESMO VISUAL DO PC
    ========================================== */

    @media (max-width: 700px) {

      .pagina {
        background:
          radial-gradient(
            ellipse at 50% 42%,
            #f7f7f7 0%,
            #eeeeee 35%,
            #dddddd 72%,
            #cccccc 100%
          );
      }

      /* Logo continua no centro */

      .cabecalho {
        top: 14px;
        width: 100%;
      }

      .logo {
        font-size: 23px;
        letter-spacing: 4px;
      }

      .slogan {
        margin-top: 4px;

        font-size: 7px;
        letter-spacing: 1.2px;
      }

      .linha {
        width: 55px;
        margin-top: 7px;
      }


      /* Mantém detalhe vermelho */

      .detalhe {
        display: block;

        top: 20px;
        left: 10px;

        width: 3px;
        height: 35px;
      }


      /* Mantém painel lateral */

      .instrucoes {
        display: block;

        left: 8px;

        width: 67px;

        padding: 6px 5px;

        border-radius: 16px;
      }

      .item {
        padding: 9px 1px;

        font-size: 6px;
      }

      .item strong {
        font-size: 7px;
      }

      .icone {
        font-size: 16px;
        margin-bottom: 4px;
      }

      .separador {
        width: 27px;
      }


      /* Tela cheia */

      .fullscreen {
        top: 15px;
        right: 10px;

        width: 39px;
        height: 39px;

        font-size: 16px;
      }


      /* Controles inferiores */

      .vistas {
        bottom: 38px;

        gap: 3px;

        padding: 5px;

        border-radius: 15px;
      }

      .vista {
        width: 47px;
        height: 43px;

        border-radius: 9px;

        font-size: 6px;
      }

      .vista span {
        font-size: 14px;
        margin-bottom: 1px;
      }


      /* Rodapé continua aparecendo */

      .rodape {
        display: flex;

        left: 9px;
        right: 9px;
        bottom: 8px;

        font-size: 6px;
      }

      .site {
        display: block;
      }

    }


    /* CELULARES MUITO ESTREITOS */

    @media (max-width: 400px) {

      .logo {
        font-size: 20px;
        letter-spacing: 3px;
      }

      .slogan {
        font-size: 6px;
      }

      .instrucoes {
        width: 60px;
      }

      .vista {
        width: 43px;
      }

      .rodape {
        font-size: 5.5px;
      }

    }

  </style>
</head>


<body>

<div class="pagina">

  <div class="detalhe"></div>


  <header class="cabecalho">

    <div class="logo">
      GONDOPAR
    </div>

    <div class="slogan">
      Gôndolas e mobiliários especiais
    </div>

    <div class="linha"></div>

  </header>


  <model-viewer

    id="produto"

    src="TESTE DERMO.glb"

    camera-controls

    auto-rotate
    auto-rotate-delay="2500"
    rotation-per-second="8deg"

    shadow-intensity="0.65"
    shadow-softness="0.9"

    exposure="1"

    environment-image="neutral"

    tone-mapping="neutral"

    interaction-prompt="none"

    camera-orbit="30deg 75deg auto"

    min-camera-orbit="auto auto 60%"
    max-camera-orbit="auto auto 300%"

    ar
    ar-modes="webxr scene-viewer quick-look">

  </model-viewer>


  <div class="instrucoes">

    <div class="item">

      <div class="icone">☝</div>

      <strong>ARRASTE</strong>
      <br>
      PARA GIRAR

    </div>

    <div class="separador"></div>


    <div class="item">

      <div class="icone">⌕</div>

      <strong>ROLE</strong>
      <br>
      PARA APROXIMAR

    </div>

    <div class="separador"></div>


    <div class="item">

      <div class="icone">◇</div>

      VISUALIZAÇÃO
      <br>
      <strong>360°</strong>

    </div>

  </div>


  <button
    class="fullscreen"
    onclick="telaCheia()"
    title="Tela cheia">

    ⛶

  </button>


  <div class="vistas">

    <button
      class="vista ativa"
      onclick="mudarVista(this,'30deg 75deg auto')">

      <span>◩</span>
      3D

    </button>


    <button
      class="vista"
      onclick="mudarVista(this,'0deg 90deg auto')">

      <span>▣</span>
      FRENTE

    </button>


    <button
      class="vista"
      onclick="mudarVista(this,'90deg 90deg auto')">

      <span>▯</span>
      LATERAL

    </button>


    <button
      class="vista"
      onclick="mudarVista(this,'180deg 90deg auto')">

      <span>▣</span>
      TRASEIRA

    </button>

  </div>


  <footer class="rodape">

    <div>
      © 2026
      <strong>GONDOPAR</strong>
      · Todos os direitos reservados.
    </div>

    <div class="site">
      <strong>www.gondopar.com.br</strong>
    </div>

  </footer>

</div>


<script>

  const produto = document.getElementById("produto");


  function mudarVista(botao, posicao) {

    produto.autoRotate = false;

    produto.cameraOrbit = posicao;

    document
      .querySelectorAll(".vista")
      .forEach(b => b.classList.remove("ativa"));

    botao.classList.add("ativa");

  }


  function telaCheia() {

    const pagina = document.querySelector(".pagina");

    if (!document.fullscreenElement) {

      pagina.requestFullscreen();

    } else {

      document.exitFullscreen();

    }

  }

</script>

</body>

</html>
